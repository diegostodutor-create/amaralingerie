<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Amara ERP • Produção e Gestão</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#17202a;--muted:#6b7680;--line:#e2e7eb;--nav:#17202a;--ok:#18794e;--warn:#946600;--bad:#b42318;--blue:#2457a6}
*{box-sizing:border-box}html,body{min-height:100%;-webkit-text-size-adjust:100%}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:20px}.loginbox{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 10px 40px #00000012}.brand{font-size:25px;font-weight:900;letter-spacing:.04em}.brand small{display:block;font-size:12px;font-weight:500;letter-spacing:0;color:var(--muted);margin-top:4px}
.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}.field label{font-size:12px;color:var(--muted)}input,select,textarea{width:100%;border:1px solid #d6dde2;border-radius:9px;padding:10px;background:white;color:var(--ink);-webkit-appearance:none;appearance:none}textarea{min-height:80px;resize:vertical}
.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--ink);color:#fff;font-weight:800;touch-action:manipulation}.btn.alt{background:#e9edf0;color:var(--ink)}.btn.good{background:var(--ok)}.btn.warn{background:var(--warn)}.btn.bad{background:var(--bad)}.btn.small{padding:7px 9px;font-size:12px}
.app{display:flex;min-height:100vh;min-height:100dvh}.side{width:235px;background:var(--nav);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh;height:100dvh;overflow:auto;-webkit-overflow-scrolling:touch}.side .brand{margin:4px 8px 20px}.nav button{width:100%;border:0;background:transparent;color:#cbd3da;text-align:left;padding:11px 12px;border-radius:9px;margin:2px 0;touch-action:manipulation}.nav button:hover,.nav button.active{background:#2a3642;color:#fff}.sidefoot{font-size:11px;color:#9faab3;padding:16px 9px}
.main{flex:1;min-width:0;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:20px}.top h1{margin:0;font-size:25px}.userbar{display:flex;align-items:center;gap:8px}.chip{border:1px solid #dbe1e5;background:#fff;padding:7px 10px;border-radius:999px;font-size:12px}.mobileMenuBtn,.mobileBackdrop{display:none}
.panel{display:none}.panel.active{display:block}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px;box-shadow:0 2px 10px #00000005}.metric b{display:block;font-size:28px;margin-top:7px}.muted{color:var(--muted);font-size:12px}.section{margin-top:18px}.section h2{font-size:17px;margin:0 0 10px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}th,td{padding:10px;border-bottom:1px solid #edf0f2;text-align:left;font-size:12px;vertical-align:top}th{background:#f8fafb;color:#5e6973;white-space:nowrap}.tablewrap{overflow:auto;-webkit-overflow-scrolling:touch}
.pill{display:inline-block;padding:4px 7px;border-radius:999px;font-size:10px;font-weight:800;background:#eef2f5}.pill.ok{background:#e7f7ee;color:var(--ok)}.pill.warn{background:#fff4d6;color:var(--warn)}.pill.bad{background:#fde9e9;color:var(--bad)}.pill.blue{background:#e7f0ff;color:var(--blue)}
.progress{height:7px;background:#edf0f2;border-radius:99px;overflow:hidden;min-width:90px}.progress i{display:block;height:100%;background:var(--ink)}
.notice{padding:10px 12px;border-radius:9px;background:#f8fafb;border:1px solid var(--line);font-size:12px}.error{color:var(--bad);font-size:12px}.success{color:var(--ok);font-size:12px}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px;z-index:90}.modal.open{display:flex}.modalbox{width:min(760px,100%);max-height:90vh;max-height:90dvh;overflow:auto;-webkit-overflow-scrolling:touch;background:#fff;border-radius:15px;padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.modalhead h2{margin:0;font-size:19px}.x{border:0;background:#eef2f5;width:34px;height:34px;border-radius:50%}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.wide{grid-column:1/-1}.kpiok{color:var(--ok)}.kpibad{color:var(--bad)}
@media(max-width:950px){.grid{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:1fr 1fr}.side{width:200px}}
@media(max-width:700px){
 body{padding-bottom:env(safe-area-inset-bottom)}body.menu-open{overflow:hidden}
 .app{display:block;min-height:100vh;min-height:100dvh}
 .side{display:block;position:fixed;left:0;top:0;width:min(82vw,300px);height:100vh;height:100dvh;transform:translateX(-105%);transition:transform .22s ease;z-index:80;padding:calc(18px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom));box-shadow:10px 0 30px #0004}
 .side.open{transform:translateX(0)}
 .mobileBackdrop{display:block;position:fixed;inset:0;border:0;background:#0008;opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:70;padding:0}
 .mobileBackdrop.open{opacity:1;pointer-events:auto}
 .mobileMenuBtn{display:inline-flex;align-items:center;justify-content:center;flex:0 0 42px;width:42px;height:42px;border:0;border-radius:10px;background:var(--ink);color:#fff;font-size:23px;font-weight:800;touch-action:manipulation}
 .main{padding:calc(10px + env(safe-area-inset-top)) 12px calc(16px + env(safe-area-inset-bottom))}
 .grid,.grid3,.grid2,.formgrid{grid-template-columns:1fr}
 .top{align-items:center;position:sticky;top:0;z-index:30;background:var(--bg);padding:5px 0 10px;margin-bottom:10px}
 .top h1{font-size:20px;flex:1;min-width:0}.userbar{flex-wrap:nowrap;justify-content:flex-end}.userbar .chip{max-width:118px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.userbar .btn{white-space:nowrap}
 input,select,textarea{font-size:16px}.tablewrap{width:100%;overflow-x:auto}table{min-width:650px}.card{padding:14px}.modal{padding:calc(10px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom))}.modalbox{max-height:calc(100vh - 20px);max-height:calc(100dvh - 20px)}
}
</style>
</head>
<body>
<div id="login" class="login">
  <div class="loginbox">
    <div class="brand">AMARA<small>ERP de Produção e Gestão</small></div>
    <h2>Acessar</h2>
    <div class="field"><label>Usuário</label><input id="loginUser" value="admin" autocomplete="username"></div>
    <div class="field"><label>Senha</label><input id="loginPass" type="password" autocomplete="current-password"></div>
    <button class="btn" style="width:100%" onclick="login()">Entrar</button>
    <p id="loginMsg" class="error"></p>
  </div>
</div>

<div id="app" class="app hidden">
<aside id="side" class="side">
  <div class="brand">AMARA<small>ERP • versão final</small></div>
  <div class="nav" id="nav">
    <button data-p="dashboard" class="active">Dashboard</button>
    <button data-p="pedidos">Pedidos</button>
    <button data-p="producao">Produção</button>
    <button data-p="qualidade">Qualidade</button>
    <button data-p="estoque">Estoque</button>
    <button data-p="expedicao">Expedição</button>
    <button data-p="cadastros">Cadastros</button>
    <button data-p="ficha">Ficha Técnica</button>
    <button data-p="custos">Custos & Preço</button>
    <button data-p="financeiro">Financeiro</button>
    <button data-p="usuarios">Usuários</button>
  </div>
  <div class="sidefoot">Dados centralizados no Supabase PostgreSQL.</div>
</aside>
<button id="mobileBackdrop" class="mobileBackdrop" onclick="closeMenu()" aria-label="Fechar menu"></button>
<main class="main">
  <div class="top"><button id="mobileMenuBtn" class="mobileMenuBtn" onclick="toggleMenu()" aria-label="Abrir menu">☰</button><h1 id="pageTitle">Dashboard</h1><div class="userbar"><span id="who" class="chip"></span><button class="btn alt small" onclick="logout()">Sair</button></div></div>
  <section id="dashboard" class="panel active"></section>
  <section id="pedidos" class="panel"></section>
  <section id="producao" class="panel"></section>
  <section id="qualidade" class="panel"></section>
  <section id="estoque" class="panel"></section>
<script>
function toggleMenu(){
  var side=document.getElementById('side');
  var backdrop=document.getElementById('mobileBackdrop');
  if(!side||!backdrop)return;
  var open=!side.classList.contains('open');
  side.classList.toggle('open',open);
  backdrop.classList.toggle('open',open);
  document.body.classList.toggle('menu-open',open);
}
function closeMenu(){
  var side=document.getElementById('side');
  var backdrop=document.getElementById('mobileBackdrop');
  if(side)side.classList.remove('open');
  if(backdrop)backdrop.classList.remove('open');
  document.body.classList.remove('menu-open');
}
document.addEventListener('DOMContentLoaded',function(){
  var buttons=document.querySelectorAll('#nav button');
  for(var i=0;i<buttons.length;i++)buttons[i].addEventListener('click',closeMenu);
  window.addEventListener('resize',function(){if(window.innerWidth>700)closeMenu()});
  var main=document.querySelector('main');
  if(main){
    var node=main.firstChild;
    while(node){
      var next=node.nextSibling;
      if(node.nodeType===3&&String(node.nodeValue||'').trim()==='>')main.removeChild(node);
      node=next;
    }
  }
});
</script>
>
  <section id="expedicao" class="panel"></section>
  <section id="cadastros" class="panel"></section>
  <section id="ficha" class="panel"></section>
  <section id="custos" class="panel"></section>
  <section id="financeiro" class="panel"></section>
  <section id="usuarios" class="panel"></section>
</main>
</div>

<div id="modal" class="modal"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle"></h2><button class="x" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>

<script>
const API='https://pklluxvpvbvomthbzahu.supabase.co/functions/v1/amara-api';
const LOGIN='https://pklluxvpvbvomthbzahu.supabase.co/functions/v1/amara-login';
const COST='https://pklluxvpvbvomthbzahu.supabase.co/functions/v1/amara-costing';
const FIN='https://pklluxvpvbvomthbzahu.supabase.co/functions/v1/amara-finance';
let token=sessionStorage.getItem('amara_token')||'', me=null, cache={};
const $=id=>document.getElementById(id), num=v=>Number(v)||0, esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=v=>num(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}), dateBR=v=>v?String(v).slice(0,10).split('-').reverse().join('/'):'—';
function pill(s){const t=String(s||'');let c=['Concluído','Entregue','Aprovado','Pago','Pronto'].includes(t)?'ok':['Atrasado','Reprovado','Cancelado'].includes(t)?'bad':['Em produção','Separando','Corte planejado'].includes(t)?'blue':'warn';return `<span class="pill ${c}">${esc(t)}</span>`}
function modal(title,body){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modal').classList.add('open')}function closeModal(){$('modal').classList.remove('open')}
async function req(base,path,opt={}){const r=await fetch(base+path,{...opt,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opt.headers||{})}});const b=await r.json().catch(()=>({}));if(!r.ok)throw new Error(b.error||`Erro ${r.status}`);return b}
const api=(p,o)=>req(API,p,o), loginApi=(o)=>req(LOGIN,'',o), costApi=(p,o)=>req(COST,p,o), finApi=(p,o)=>req(FIN,p,o);
async function login(){try{const b=await loginApi({method:'POST',body:JSON.stringify({username:$('loginUser').value,password:$('loginPass').value})});token=b.token;me=b.user;sessionStorage.setItem('amara_token',token);sessionStorage.setItem('amara_user',JSON.stringify(me));showApp();await refreshAll()}catch(e){$('loginMsg').textContent=e.message}}
async function logout(){try{await api('/auth/logout',{method:'POST'})}catch{}sessionStorage.clear();location.reload()}
function showApp(){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=`${me.name} • ${me.role}`;applyRole()}
function applyRole(){const role=me?.role||'';document.querySelector('[data-p="financeiro"]').classList.toggle('hidden',!['Administrador','Gestor'].includes(role));document.querySelector('[data-p="usuarios"]').classList.toggle('hidden',role!=='Administrador');document.querySelector('[data-p="custos"]').classList.toggle('hidden',!['Administrador','Gestor'].includes(role));document.querySelector('[data-p="ficha"]').classList.toggle('hidden',!['Administrador','Gestor'].includes(role));document.querySelector('[data-p="cadastros"]').classList.toggle('hidden',!['Administrador','Gestor'].includes(role))}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>openPanel(b.dataset.p,b));
function openPanel(id,btn){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('active'));btn?.classList.add('active');$('pageTitle').textContent=btn?.textContent||id}
async function getEntity(e){return api('/entities/'+e)}
async function refreshAll(){try{const basics=await Promise.all(['orders','ops','materials','products','clients','workers','colors','shipments','productMaterials'].map(async e=>[e,await getEntity(e)]));cache=Object.fromEntries(basics);renderDashboard();renderOrders();renderProduction();renderQuality();renderStock();renderShipments();renderCadastros();renderFicha();if(['Administrador','Gestor'].includes(me.role)){await renderCosts();await renderFinance()}if(me.role==='Administrador')await renderUsers()}catch(e){alert(e.message)}}
function totalOp(o){return num(o.M)+num(o.G)+num(o.GG)}function doneOp(o){return num(o.doneM)+num(o.doneG)+num(o.doneGG)}function pct(a,b){return b?Math.min(100,Math.round(a/b*100)):0}

async function renderDashboard(){let alerts=[];try{alerts=await api('/alerts')}catch{}const open=(cache.orders||[]).filter(x=>!['Entregue','Cancelado'].includes(x.status)).length,target=(cache.ops||[]).reduce((a,o)=>a+totalOp(o),0),done=(cache.ops||[]).reduce((a,o)=>a+doneOp(o),0),low=(cache.materials||[]).filter(m=>num(m.stock)<=num(m.min)).length;$('dashboard').innerHTML=`<div class="grid"><div class="card metric"><span class="muted">Pedidos em aberto</span><b>${open}</b></div><div class="card metric"><span class="muted">Peças planejadas</span><b>${target}</b></div><div class="card metric"><span class="muted">Peças produzidas</span><b>${done}</b></div><div class="card metric"><span class="muted">Alertas de estoque</span><b>${low}</b></div></div><div class="grid2 section"><div class="card"><h2>Alertas</h2>${alerts.length?alerts.map(a=>`<div class="notice" style="margin:7px 0"><b>${esc(a.severity)} — ${esc(a.title)}</b><br><span class="muted">${esc(a.detail)}</span></div>`).join(''):'<span class="muted">Sem alertas.</span>'}</div><div class="card"><h2>Fluxo</h2><p>Pedido → Corte → OP → Apontamento → Qualidade → Expedição → Entrega</p><p class="muted">Baixa de materiais pela ficha técnica e financeiro integrado.</p></div></div>`}

function renderOrders(){const can=['Administrador','Gestor'].includes(me.role);$('pedidos').innerHTML=`<div class="toolbar">${can?'<button class="btn" onclick="newOrder()">+ Novo pedido</button>':''}<button class="btn alt" onclick="refreshAll()">Atualizar</button></div><div class="tablewrap"><table><thead><tr><th>Pedido</th><th>Cliente</th><th>Modelo</th><th>Qtd.</th><th>Prazo</th><th>Status</th><th>Financeiro</th><th>Ações</th></tr></thead><tbody>${(cache.orders||[]).map(o=>`<tr><td>${esc(o.id)}</td><td>${esc(o.client)}</td><td>${esc(o.product)}</td><td>${o.qty}</td><td>${dateBR(o.due)}</td><td>${pill(o.status)}</td><td>${pill(o.financial_status||'Pendente')}</td><td><div class="toolbar"><button class="btn alt small" onclick="orderDetails('${o.id}')">Ver</button>${can&&!['Corte planejado','Em produção','Pronto','Separando','Entregue'].includes(o.status)?`<button class="btn small" onclick="makeCut('${o.id}')">Corte</button>`:''}${can?`<button class="btn alt small" onclick="financialize('${o.id}')">Financeiro</button>`:''}</div></td></tr>`).join('')}</tbody></table></div>`}
function newOrder(){modal('Novo pedido',`<div class="formgrid"><div class="field"><label>Cliente</label><select id="fClient">${(cache.clients||[]).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Modelo</label><select id="fProduct">${(cache.products||[]).filter(p=>p.active!==false).map(p=>`<option>${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Quantidade</label><input id="fQty" type="number" min="1"></div><div class="field"><label>Prazo</label><input id="fDue" type="date"></div><div class="field"><label>Preço unitário</label><input id="fPrice" type="number" step=".01" value="0"></div><div class="field wide"><label>Observações</label><textarea id="fNotes"></textarea></div></div><button class="btn" onclick="saveOrder()">Salvar</button>`)}
async function saveOrder(){try{const c=cache.clients.find(x=>x.id===$('fClient').value),id='PED'+Date.now().toString(36).toUpperCase();await api('/entities/orders',{method:'POST',body:JSON.stringify({id,client_id:c.id,client:c.name,product:$('fProduct').value,qty:num($('fQty').value),due:$('fDue').value||null,status:'Aguardando corte',notes:$('fNotes').value,mix:{},unit_price:num($('fPrice').value),financial_status:'Pendente'})});closeModal();await refreshAll()}catch(e){alert(e.message)}}
function orderDetails(id){const o=cache.orders.find(x=>x.id===id),ops=cache.ops.filter(x=>x.orderId===id),s=cache.shipments.find(x=>x.orderId===id);modal('Pedido '+id,`<div class="grid3"><div class="card"><span class="muted">Cliente</span><b>${esc(o.client)}</b></div><div class="card"><span class="muted">Modelo</span><b>${esc(o.product)}</b></div><div class="card"><span class="muted">Quantidade</span><b>${o.qty}</b></div></div><div class="section"><h2>OPs</h2>${ops.length?ops.map(x=>`<div class="notice" style="margin:5px 0">${esc(x.id)} • ${esc(x.color)} • ${doneOp(x)}/${totalOp(x)} • ${esc(x.status)}</div>`).join(''):'<span class="muted">Sem OPs.</span>'}</div>${s?`<div class="section card"><b>Expedição:</b> ${esc(s.status)} • ${dateBR(s.date)}</div>`:''}`)}
function makeCut(id){const o=cache.orders.find(x=>x.id===id);modal('Distribuição por cor — '+id,`<p>Total do pedido: <b>${o.qty}</b></p>${(cache.colors||[]).map(c=>`<div class="field"><label>${esc(c)}</label><input class="mix" data-color="${esc(c)}" type="number" min="0" value="0"></div>`).join('')}<button class="btn" onclick="saveCut('${id}')">Gerar corte e OPs 20/40/40</button>`)}
async function saveCut(id){try{const mix={};document.querySelectorAll('.mix').forEach(x=>{const v=num(x.value);if(v)mix[x.dataset.color]=v});await api('/orders/'+id+'/cut',{method:'POST',body:JSON.stringify({mix})});closeModal();await refreshAll()}catch(e){alert(e.message)}}
function financialize(id){const o=cache.orders.find(x=>x.id===id);modal('Financeiro do pedido '+id,`<div class="formgrid"><div class="field"><label>Preço unitário</label><input id="ffPrice" type="number" step=".01" value="${num(o.unit_price)}"></div><div class="field"><label>Desconto total</label><input id="ffDiscount" type="number" step=".01" value="${num(o.discount_amount)}"></div><div class="field"><label>Frete</label><input id="ffFreight" type="number" step=".01" value="${num(o.freight_amount)}"></div><div class="field"><label>Vencimento</label><input id="ffDue" type="date" value="${o.due||''}"></div></div><button class="btn" onclick="saveFinancial('${id}')">Gerar/atualizar conta a receber</button>`)}
async function saveFinancial(id){try{const r=await finApi('/orders/'+id+'/financialize',{method:'POST',body:JSON.stringify({unitPrice:num($('ffPrice').value),discountAmount:num($('ffDiscount').value),freightAmount:num($('ffFreight').value),dueDate:$('ffDue').value})});alert(`Total: ${money(r.total)} | Custo estimado: ${money(r.totalCost)} | Lucro estimado: ${money(r.estimatedProfit)}`);closeModal();await refreshAll()}catch(e){alert(e.message)}}

function renderProduction(){$('producao').innerHTML=`<div class="toolbar"><button class="btn alt" onclick="refreshAll()">Atualizar</button></div><div class="tablewrap"><table><thead><tr><th>OP</th><th>Pedido</th><th>Modelo/Cor</th><th>Planejado</th><th>Produzido</th><th>Progresso</th><th>Responsável</th><th>Status</th><th></th></tr></thead><tbody>${(cache.ops||[]).map(o=>{const t=totalOp(o),d=doneOp(o),w=cache.workers.find(x=>x.id===o.workerId);return `<tr><td>${esc(o.id)}</td><td>${esc(o.orderId)}</td><td>${esc(o.product)} / ${esc(o.color)}</td><td>${t}</td><td>${d}</td><td><div class="progress"><i style="width:${pct(d,t)}%"></i></div>${pct(d,t)}%</td><td>${esc(w?.name||'—')}</td><td>${pill(o.status)}</td><td><div class="toolbar">${!['Concluído','Aguardando qualidade'].includes(o.status)?`<button class="btn small" onclick="pointOp('${o.id}')">Apontar</button>`:''}<button class="btn alt small" onclick="historyOp('${o.id}')">Histórico</button></div></td></tr>`}).join('')}</tbody></table></div>`}
function pointOp(id){const o=cache.ops.find(x=>x.id===id);modal('Apontar '+id,`<div class="formgrid"><div class="field"><label>M (saldo ${num(o.M)-num(o.doneM)})</label><input id="pM" type="number" min="0" value="0"></div><div class="field"><label>G (saldo ${num(o.G)-num(o.doneG)})</label><input id="pG" type="number" min="0" value="0"></div><div class="field"><label>GG (saldo ${num(o.GG)-num(o.doneGG)})</label><input id="pGG" type="number" min="0" value="0"></div><div class="field"><label>Minutos trabalhados</label><input id="pMin" type="number" min="0" value="0"></div><div class="field wide"><label>Responsável</label><select id="pWorker">${(cache.workers||[]).filter(w=>w.active!==false).map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join('')}</select></div></div><div class="notice">O apontamento baixa automaticamente os materiais definidos na ficha técnica.</div><br><button class="btn" onclick="savePoint('${id}')">Confirmar apontamento</button>`)}
async function savePoint(id){try{const r=await api('/ops/'+id+'/point',{method:'POST',body:JSON.stringify({M:num($('pM').value),G:num($('pG').value),GG:num($('pGG').value),durationMinutes:num($('pMin').value),workerId:$('pWorker').value})});alert(`Apontamento salvo. ${r.materials?.length||0} material(is) movimentado(s).`);closeModal();await refreshAll()}catch(e){alert(e.message)}}
async function historyOp(id){try{const h=await api('/ops/'+id+'/history');modal('Histórico '+id,`<div class="section"><h2>Eventos</h2>${(h.events||[]).map(e=>`<div class="notice" style="margin:6px 0"><b>${dateBR(e.created_at)} • ${esc(e.event_type)}</b><br>${esc(e.description)}<br><span class="muted">${esc(e.actor_name||'')}</span></div>`).join('')||'<span class="muted">Sem eventos.</span>'}</div><div class="section"><h2>Apontamentos</h2>${(h.production||[]).map(p=>`<div class="notice" style="margin:6px 0">M ${p.M} • G ${p.G} • GG ${p.GG} • ${p.durationMinutes} min</div>`).join('')||'<span class="muted">Sem apontamentos.</span>'}</div>`) }catch(e){alert(e.message)}}

function renderQuality(){const list=(cache.ops||[]).filter(o=>['Aguardando qualidade','Retrabalho'].includes(o.status));$('qualidade').innerHTML=`${list.length?`<div class="tablewrap"><table><thead><tr><th>OP</th><th>Modelo/Cor</th><th>Produzido</th><th>Status</th><th>Ação</th></tr></thead><tbody>${list.map(o=>`<tr><td>${o.id}</td><td>${esc(o.product)} / ${esc(o.color)}</td><td>${doneOp(o)}</td><td>${pill(o.status)}</td><td><button class="btn small" onclick="qualityOp('${o.id}')">Inspecionar</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="card muted">Nenhuma OP aguardando qualidade.</div>'}`}
function qualityOp(id){modal('Qualidade '+id,`<div class="field"><label>Resultado</label><select id="qStatus"><option>Aprovado</option><option>Reprovado</option></select></div><div class="field"><label>Qtd. rejeitada</label><input id="qReject" type="number" min="0" value="0"></div><div class="field"><label>Tipo de defeito</label><input id="qType" value="Qualidade"></div><div class="field"><label>Observações</label><textarea id="qNotes"></textarea></div><button class="btn" onclick="saveQuality('${id}')">Salvar inspeção</button>`)}
async function saveQuality(id){try{await api('/ops/'+id+'/quality',{method:'POST',body:JSON.stringify({status:$('qStatus').value,rejected:num($('qReject').value),defectType:$('qType').value,notes:$('qNotes').value})});closeModal();await refreshAll()}catch(e){alert(e.message)}}

function renderStock(){const can=['Administrador','Gestor'].includes(me.role);$('estoque').innerHTML=`<div class="toolbar">${can?'<button class="btn" onclick="newMaterial()">+ Material</button>':''}</div><div class="tablewrap"><table><thead><tr><th>Material</th><th>Unid.</th><th>Estoque</th><th>Mínimo</th><th>Custo</th><th>Status</th><th></th></tr></thead><tbody>${(cache.materials||[]).map(m=>`<tr><td>${esc(m.name)}</td><td>${esc(m.unit)}</td><td>${m.stock}</td><td>${m.min}</td><td>${money(m.cost)}</td><td>${num(m.stock)<=num(m.min)?pill(num(m.stock)<=0?'Crítico':'Atenção'):pill('Normal')}</td><td>${can?`<button class="btn alt small" onclick="editMaterial('${m.id}')">Editar</button>`:''}</td></tr>`).join('')}</tbody></table></div>`}
function newMaterial(){modal('Novo material',materialForm())}function materialForm(m={}){return `<div class="formgrid"><div class="field"><label>Nome</label><input id="mName" value="${esc(m.name||'')}"></div><div class="field"><label>Unidade</label><input id="mUnit" value="${esc(m.unit||'m')}"></div><div class="field"><label>Estoque</label><input id="mStock" type="number" step=".001" value="${num(m.stock)}"></div><div class="field"><label>Estoque mínimo</label><input id="mMin" type="number" step=".001" value="${num(m.min)}"></div><div class="field"><label>Custo unitário</label><input id="mCost" type="number" step=".0001" value="${num(m.cost)}"></div></div><button class="btn" onclick="saveMaterial('${m.id||''}')">Salvar</button>`}
function editMaterial(id){modal('Editar material',materialForm(cache.materials.find(x=>x.id===id)))}
async function saveMaterial(id){try{const body={name:$('mName').value,unit:$('mUnit').value,stock:num($('mStock').value),min:num($('mMin').value),cost:num($('mCost').value)};await api('/entities/materials'+(id?'/'+id:''),{method:id?'PATCH':'POST',body:JSON.stringify(body)});closeModal();await refreshAll()}catch(e){alert(e.message)}}

function renderShipments(){const can=['Administrador','Gestor','Expedição'].includes(me.role),ships=cache.shipments||[];$('expedicao').innerHTML=`<div class="section"><h2>Pedidos prontos</h2>${(cache.orders||[]).filter(o=>o.status==='Pronto').length?`<div class="tablewrap"><table><tbody>${cache.orders.filter(o=>o.status==='Pronto').map(o=>`<tr><td>${o.id}</td><td>${esc(o.client)}</td><td>${esc(o.product)}</td><td>${o.qty}</td><td>${can?`<button class="btn small" onclick="createShipment('${o.id}')">Criar expedição</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:'<div class="card muted">Nenhum pedido pronto.</div>'}</div><div class="section"><h2>Expedições</h2><div class="tablewrap"><table><thead><tr><th>ID</th><th>Pedido</th><th>Status</th><th>Data</th><th>Transportador</th><th></th></tr></thead><tbody>${ships.map(s=>`<tr><td>${s.id}</td><td>${s.orderId}</td><td>${pill(s.status)}</td><td>${dateBR(s.date)}</td><td>${esc(s.carrier)}</td><td>${can&&s.status!=='Entregue'?`<button class="btn good small" onclick="deliver('${s.id}')">Marcar entregue</button>`:''}</td></tr>`).join('')}</tbody></table></div></div>`}
function createShipment(orderId){modal('Nova expedição',`<div class="field"><label>Transportador / Entregador</label><input id="sCarrier"></div><div class="field"><label>Data</label><input id="sDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Observações</label><textarea id="sNotes"></textarea></div><button class="btn" onclick="saveShipment('${orderId}')">Criar</button>`)}
async function saveShipment(orderId){try{await api('/orders/'+orderId+'/shipment',{method:'POST',body:JSON.stringify({carrier:$('sCarrier').value,date:$('sDate').value,notes:$('sNotes').value})});closeModal();await refreshAll()}catch(e){alert(e.message)}}async function deliver(id){if(!confirm('Confirmar entrega?'))return;try{await api('/shipments/'+id+'/deliver',{method:'POST'});await refreshAll()}catch(e){alert(e.message)}}

function renderCadastros(){$('cadastros').innerHTML=`<div class="grid2"><div class="card"><h2>Clientes</h2><div class="toolbar"><button class="btn small" onclick="newClient()">+ Cliente</button></div>${(cache.clients||[]).map(c=>`<div class="notice" style="margin:5px 0"><b>${esc(c.name)}</b><br>${esc(c.phone||'')} • ${esc(c.city||'')})}</div>`).join('')}</div><div class="card"><h2>Modelos</h2><div class="toolbar"><button class="btn small" onclick="newProduct()">+ Modelo</button></div>${(cache.products||[]).map(p=>`<div class="notice" style="margin:5px 0"><b>${esc(p.name)}</b> • ${p.active===false?'Inativo':'Ativo'}<br><span class="muted">Meta padrão: ${num(p.default_target_pieces_hour)} pç/h</span></div>`).join('')}</div><div class="card"><h2>Funcionários</h2><div class="toolbar"><button class="btn small" onclick="newWorker()">+ Funcionário</button></div>${(cache.workers||[]).map(w=>`<div class="notice" style="margin:5px 0"><b>${esc(w.name)}</b> • ${esc(w.sector||'')}</div>`).join('')}</div><div class="card"><h2>Cores</h2><div class="toolbar"><button class="btn small" onclick="newColor()">+ Cor</button></div>${(cache.colors||[]).map(c=>`<span class="chip" style="display:inline-block;margin:4px">${esc(c)}</span>`).join('')}</div></div>`}
function newClient(){modal('Novo cliente',`<div class="field"><label>Nome</label><input id="cName"></div><div class="field"><label>Telefone</label><input id="cPhone"></div><div class="field"><label>Cidade</label><input id="cCity"></div><button class="btn" onclick="saveClient()">Salvar</button>`)}async function saveClient(){try{await api('/entities/clients',{method:'POST',body:JSON.stringify({name:$('cName').value,phone:$('cPhone').value,city:$('cCity').value})});closeModal();await refreshAll()}catch(e){alert(e.message)}}
function newProduct(){modal('Novo modelo',`<div class="field"><label>Nome</label><input id="prName"></div><div class="field"><label>Meta padrão pç/h</label><input id="prTarget" type="number" value="0"></div><button class="btn" onclick="saveProduct()">Salvar</button>`)}async function saveProduct(){try{await api('/entities/products',{method:'POST',body:JSON.stringify({name:$('prName').value,defaultTargetPiecesHour:num($('prTarget').value),active:true})});closeModal();await refreshAll()}catch(e){alert(e.message)}}
function newWorker(){modal('Novo funcionário',`<div class="field"><label>Nome</label><input id="wName"></div><div class="field"><label>Setor</label><input id="wSector" value="Produção"></div><button class="btn" onclick="saveWorker()">Salvar</button>`)}async function saveWorker(){try{await api('/entities/workers',{method:'POST',body:JSON.stringify({name:$('wName').value,sector:$('wSector').value,active:true})});closeModal();await refreshAll()}catch(e){alert(e.message)}}
async function newColor(){const name=prompt('Nome da cor:');if(!name)return;try{await api('/entities/colors',{method:'POST',body:JSON.stringify(name)});await refreshAll()}catch(e){alert(e.message)}}

function renderFicha(){const p=cache.products?.[0];$('ficha').innerHTML=`<div class="card"><div class="field"><label>Modelo</label><select id="ftProduct" onchange="renderFichaProduct()">${(cache.products||[]).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div id="ftBody"></div></div>`;if(p)renderFichaProduct()}
function renderFichaProduct(){const pid=$('ftProduct')?.value||cache.products?.[0]?.id,items=(cache.productMaterials||[]).filter(x=>x.productId===pid&&x.active!==false);$('ftBody').innerHTML=`<div class="toolbar"><button class="btn" onclick="addFicha('${pid}')">+ Insumo na ficha</button></div><div class="tablewrap"><table><thead><tr><th>Material</th><th>Consumo/peça</th><th>Perda</th><th>Consumo efetivo</th><th></th></tr></thead><tbody>${items.map(i=>{const m=cache.materials.find(x=>x.id===i.materialId);return `<tr><td>${esc(m?.name||i.materialId)}</td><td>${i.consumptionPerPiece} ${esc(m?.unit||'')}</td><td>${i.wastePercent}%</td><td>${(num(i.consumptionPerPiece)*(1+num(i.wastePercent)/100)).toFixed(4)}</td><td><button class="btn bad small" onclick="deleteFicha('${i.id}')">Remover</button></td></tr>`}).join('')}</tbody></table></div>`}
function addFicha(pid){modal('Adicionar insumo',`<div class="field"><label>Material</label><select id="ftMat">${(cache.materials||[]).map(m=>`<option value="${m.id}">${esc(m.name)} (${esc(m.unit)})</option>`).join('')}</select></div><div class="field"><label>Consumo por peça</label><input id="ftCons" type="number" step=".0001"></div><div class="field"><label>Perda %</label><input id="ftWaste" type="number" step=".01" value="0"></div><button class="btn" onclick="saveFicha('${pid}')">Salvar</button>`)}
async function saveFicha(pid){try{await api('/entities/productMaterials',{method:'POST',body:JSON.stringify({productId:pid,materialId:$('ftMat').value,consumptionPerPiece:num($('ftCons').value),wastePercent:num($('ftWaste').value),sequence:0,active:true})});closeModal();await refreshAll()}catch(e){alert(e.message)}}async function deleteFicha(id){if(!confirm('Remover este insumo?'))return;try{await api('/entities/productMaterials/'+id,{method:'DELETE'});await refreshAll()}catch(e){alert(e.message)}}

async function renderCosts(){const p=cache.products?.[0];$('custos').innerHTML=`<div class="card"><div class="field"><label>Modelo</label><select id="costProduct" onchange="loadCost()">${(cache.products||[]).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div id="costBody"></div></div>`;if(p)await loadCost()}
async function loadCost(){const pid=$('costProduct')?.value;if(!pid)return;const p=cache.products.find(x=>x.id===pid);let c;try{c=await costApi('?productId='+encodeURIComponent(pid))}catch(e){$('costBody').innerHTML=`<p class="error">${esc(e.message)}</p>`;return}$('costBody').innerHTML=`<div class="grid"><div class="card metric"><span class="muted">Materiais</span><b>${money(c.costs.materials)}</b></div><div class="card metric"><span class="muted">Custo total/peça</span><b>${money(c.costs.totalCostPerPiece)}</b></div><div class="card metric"><span class="muted">Preço recomendado</span><b>${money(c.costs.recommendedSalePrice)}</b></div><div class="card metric"><span class="muted">Margem atual</span><b class="${c.costs.currentMarginPercent>=num(p.target_margin_percent)?'kpiok':'kpibad'}">${c.costs.currentMarginPercent}%</b></div></div><div class="section card"><h2>Parâmetros</h2><div class="formgrid"><div class="field"><label>Mão de obra/peça</label><input id="coLabor" type="number" step=".01" value="${num(p.labor_cost_per_piece)}"></div><div class="field"><label>Custo fixo/peça</label><input id="coFixed" type="number" step=".01" value="${num(p.fixed_cost_per_piece)}"></div><div class="field"><label>Custos indiretos %</label><input id="coOver" type="number" step=".01" value="${num(p.overhead_percent)}"></div><div class="field"><label>Impostos %</label><input id="coTax" type="number" step=".01" value="${num(p.tax_percent)}"></div><div class="field"><label>Margem alvo %</label><input id="coMargin" type="number" step=".01" value="${num(p.target_margin_percent)}"></div><div class="field"><label>Preço atual</label><input id="coSale" type="number" step=".01" value="${num(p.sale_price)}"></div></div><button class="btn" onclick="saveCostParams('${pid}')">Salvar e recalcular</button></div><div class="section card"><h2>Composição de materiais</h2>${c.materials.map(x=>`<div class="notice" style="margin:5px 0">${esc(x.material)}: ${x.effectiveConsumption} ${esc(x.unit)} × ${money(x.unitCost)} = <b>${money(x.costPerPiece)}</b></div>`).join('')||'<span class="muted">Ficha técnica vazia.</span>'}</div>`}
async function saveCostParams(pid){try{await api('/entities/products/'+pid,{method:'PATCH',body:JSON.stringify({labor_cost_per_piece:num($('coLabor').value),fixed_cost_per_piece:num($('coFixed').value),overhead_percent:num($('coOver').value),tax_percent:num($('coTax').value),target_margin_percent:num($('coMargin').value),sale_price:num($('coSale').value)})});await refreshAll();await loadCost()}catch(e){alert(e.message)}}

async function renderFinance(){let sum,rec,exp,prof;try{[sum,rec,exp,prof]=await Promise.all([finApi('/summary'),finApi('/receivables'),finApi('/expenses'),finApi('/orders-profit')])}catch(e){$('financeiro').innerHTML=`<p class="error">${esc(e.message)}</p>`;return}$('financeiro').innerHTML=`<div class="grid"><div class="card metric"><span class="muted">Recebido no mês</span><b>${money(sum.received)}</b></div><div class="card metric"><span class="muted">Despesas pagas</span><b>${money(sum.expenses)}</b></div><div class="card metric"><span class="muted">Resultado de caixa</span><b class="${sum.cashResult>=0?'kpiok':'kpibad'}">${money(sum.cashResult)}</b></div><div class="card metric"><span class="muted">A receber</span><b>${money(sum.openReceivables)}</b></div></div><div class="grid2 section"><div class="card"><h2>Contas a receber</h2><div class="tablewrap"><table><thead><tr><th>Cliente</th><th>Venc.</th><th>Total</th><th>Pago</th><th>Saldo</th><th>Status</th><th></th></tr></thead><tbody>${rec.map(r=>`<tr><td>${esc(r.client)}</td><td>${dateBR(r.due_date)}</td><td>${money(r.amount)}</td><td>${money(r.paid)}</td><td>${money(r.balance)}</td><td>${pill(r.status)}</td><td>${r.balance>0?`<button class="btn good small" onclick="payRec('${r.id}',${r.balance})">Receber</button>`:''}</td></tr>`).join('')}</tbody></table></div></div><div class="card"><h2>Despesas</h2><div class="toolbar"><button class="btn" onclick="newExpense()">+ Despesa</button></div><div class="tablewrap"><table><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Valor</th><th>Status</th></tr></thead><tbody>${exp.map(x=>`<tr><td>${dateBR(x.expense_date)}</td><td>${esc(x.description)}</td><td>${esc(x.category)}</td><td>${money(x.amount)}</td><td>${pill(x.status)}</td></tr>`).join('')}</tbody></table></div></div></div><div class="section card"><h2>Rentabilidade estimada dos pedidos</h2><div class="tablewrap"><table><thead><tr><th>Pedido</th><th>Cliente</th><th>Modelo</th><th>Receita</th><th>Custo</th><th>Lucro</th><th>Margem</th></tr></thead><tbody>${prof.map(o=>`<tr><td>${o.id}</td><td>${esc(o.client)}</td><td>${esc(o.product)}</td><td>${money(o.revenue)}</td><td>${money(o.estimated_cost)}</td><td>${money(o.estimated_profit)}</td><td>${o.estimated_margin}%</td></tr>`).join('')}</tbody></table></div></div>`}
function payRec(id,balance){modal('Registrar recebimento',`<div class="field"><label>Valor</label><input id="payAmount" type="number" step=".01" value="${balance}"></div><div class="field"><label>Data</label><input id="payDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Forma</label><select id="payMethod"><option>Pix</option><option>Dinheiro</option><option>Boleto</option><option>Cartão</option><option>Transferência</option></select></div><button class="btn good" onclick="savePay('${id}')">Confirmar recebimento</button>`)}
async function savePay(id){try{await finApi('/receivables/'+id+'/pay',{method:'POST',body:JSON.stringify({amount:num($('payAmount').value),paymentDate:$('payDate').value,method:$('payMethod').value})});closeModal();await renderFinance();await refreshAll()}catch(e){alert(e.message)}}
function newExpense(){modal('Nova despesa',`<div class="formgrid"><div class="field"><label>Descrição</label><input id="exDesc"></div><div class="field"><label>Categoria</label><select id="exCat"><option>Operacional</option><option>Matéria-prima</option><option>Folha</option><option>Energia</option><option>Manutenção</option><option>Frete</option><option>Impostos</option><option>Outros</option></select></div><div class="field"><label>Valor</label><input id="exAmount" type="number" step=".01"></div><div class="field"><label>Data</label><input id="exDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Fornecedor</label><input id="exSupplier"></div><div class="field"><label>Status</label><select id="exStatus"><option>Pago</option><option>Pendente</option></select></div></div><button class="btn" onclick="saveExpense()">Salvar</button>`)}
async function saveExpense(){try{await finApi('/expenses',{method:'POST',body:JSON.stringify({description:$('exDesc').value,category:$('exCat').value,amount:num($('exAmount').value),expenseDate:$('exDate').value,supplier:$('exSupplier').value,status:$('exStatus').value})});closeModal();await renderFinance()}catch(e){alert(e.message)}}

async function renderUsers(){let us=[];try{us=await api('/users')}catch(e){$('usuarios').innerHTML=`<p class="error">${esc(e.message)}</p>`;return}$('usuarios').innerHTML=`<div class="toolbar"><button class="btn" onclick="newUser()">+ Usuário</button></div><div class="tablewrap"><table><thead><tr><th>Nome</th><th>Usuário</th><th>Perfil</th><th>Ativo</th><th>Ações</th></tr></thead><tbody>${us.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.username)}</td><td>${esc(u.role)}</td><td>${u.active?'Sim':'Não'}</td><td><div class="toolbar"><button class="btn alt small" onclick="resetPass('${u.id}')">Senha</button><button class="btn ${u.active?'bad':'good'} small" onclick="toggleUser('${u.id}',${!u.active})">${u.active?'Desativar':'Ativar'}</button></div></td></tr>`).join('')}</tbody></table></div>`}
function newUser(){modal('Novo usuário',`<div class="field"><label>Nome</label><input id="uName"></div><div class="field"><label>Usuário</label><input id="uUser"></div><div class="field"><label>Senha inicial</label><input id="uPass" type="password"></div><div class="field"><label>Perfil</label><select id="uRole"><option>Gestor</option><option>Produção</option><option>Estoque</option><option>Expedição</option><option>Administrador</option></select></div><button class="btn" onclick="saveUser()">Criar</button>`)}
async function saveUser(){try{await api('/users',{method:'POST',body:JSON.stringify({name:$('uName').value,username:$('uUser').value,password:$('uPass').value,role:$('uRole').value})});closeModal();await renderUsers()}catch(e){alert(e.message)}}function resetPass(id){const p=prompt('Nova senha (mínimo 8 caracteres):');if(!p)return;api('/users/'+id+'/password',{method:'POST',body:JSON.stringify({password:p})}).then(()=>alert('Senha alterada.')).catch(e=>alert(e.message))}async function toggleUser(id,active){try{await api('/users/'+id+'/active',{method:'PATCH',body:JSON.stringify({active})});await renderUsers()}catch(e){alert(e.message)}}

(async()=>{if(token){try{me=JSON.parse(sessionStorage.getItem('amara_user')||'null')||await api('/me');showApp();await refreshAll()}catch{sessionStorage.clear();token=''}}})();
